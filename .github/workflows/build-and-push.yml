name: Build and push image (reusable)

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      role_to_assume:
        description: ARN of the GitHub-deploy IAM role (ecs-cluster module output).
        required: true
        type: string
      ecr_repository:
        description: ECR repository name (ecs-fargate-service module output `ecr_repository_name`).
        required: true
        type: string
      dockerfile_context:
        description: Build context passed to `docker build`.
        required: false
        type: string
        default: "."
    outputs:
      image:
        description: Full image URI (repo:tag) that was pushed.
        value: ${{ jobs.build.outputs.image }}

permissions:
  id-token: write # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY debug step - prints the actual sub/aud claims GitHub
      # issued for this run, decoded from the real OIDC token. Remove once
      # the AssumeRoleWithWebIdentity trust-policy mismatch is diagnosed.
      - name: Debug - print OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr_repository }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" "${{ inputs.dockerfile_context }}"
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          echo "image=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
